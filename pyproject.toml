[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "origami-texturing"
version = "0.1.0"
description = "Notebook-friendly Python workspace for origami texturing experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipykernel",
    "jupyterlab",
    "matplotlib",
    "numpy",
    "pillow",
    "python-dotenv",
    "openai",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
